name: Build

on:
  push:
    branches:
      - '**'

jobs:
  build:
    name: Build DolphinClient
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Resolve mod version
        id: version
        run: echo "version=$(grep -E '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Stage jar and mrpack
        run: |
          mkdir -p build/upload
          mapfile -t jars < <(find versions/*/build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-dev*.jar' ! -name '*-sources*.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected one release jar, found ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          cp -v "${jars[0]}" build/upload/
          python3 pack/build_mrpack.py \
            --dolphin-jar "${jars[0]}" \
            --output "build/upload/Dolphin-Optimized.Pink.v${{ steps.version.outputs.version }}.mrpack" \
            --check

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: DolphinClient-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: build/upload/
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
